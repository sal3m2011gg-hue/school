<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Circular Download Button</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .download-btn {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38bdf8;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      outline: none;
    }

    .download-btn svg {
      width: 28px;
      height: 28px;
      transition: transform 0.3s ease, stroke 0.3s ease;
      stroke: #38bdf8;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .download-btn::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #38bdf8;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .download-btn:hover {
      background: #38bdf8;
      transform: translateY(-3px);
      box-shadow: 0 15px 30px -5px rgba(56, 189, 248, 0.4);
    }

    .download-btn:hover svg {
      stroke: #0f172a;
      transform: translateY(2px);
    }

    .download-btn:active {
      transform: scale(0.95);
    }

    .download-btn.loading {
      pointer-events: none;
      background: #1e293b;
      border-color: transparent;
    }

    .download-btn.loading svg {
      opacity: 0;
      transform: scale(0.5);
    }

    .download-btn.loading::before {
      opacity: 1;
      animation: spin 1s linear infinite;
    }

    .download-btn.success {
      background: #10b981;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
    }

    .download-btn.success svg {
      stroke: #ffffff;
      transform: translateY(0);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <button class="download-btn" id="dlBtn" aria-label="تحميل">
    <svg id="btnIcon" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
  </button>

  <script>
    // ==========================================
    // ⬅️ ضع رابط الملف أو الموقع الخاص بك هنا بين التنصيص
    const myUrl = "https://www.mediafire.com/file/qmqnoqwnd9yrlji/%25D9%2586%25D9%2585%25D9%2588%25D8%25B0%25D8%25AC_%25D9%2584%25D8%25AA%25D8%25B5%25D9%2586%25D9%258A%25D9%2581_%25D8%25A7%25D9%2582%25D9%2584_%25D9%2588%25D8%25A7%25D9%2583%25D9%2585%25D9%258A%25D8%25A9_%25D9%2585%25D8%25A8%25D8%25A7%25D8%25B9%25D9%2587_%25D9%2585%25D8%25B9_%25D8%25B0%25D9%2583%25D8%25B1_%25D8%25A7%25D9%2584%25D8%25B5%25D9%2586%25D9%2581.xlsx/file"; 
    // ==========================================

    const btn = document.getElementById('dlBtn');
    const icon = document.getElementById('btnIcon');

    const checkIcon = `<polyline points="20 6 9 17 4 12"></polyline>`;
    const arrowIcon = `
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    `;

    btn.addEventListener('click', () => {
      btn.classList.add('loading');

      setTimeout(() => {
        btn.classList.remove('loading');
        btn.classList.add('success');
        icon.innerHTML = checkIcon;

        // فتح الرابط أو بدء التحميل تلقائياً
        const a = document.createElement('a');
        a.href = myUrl;
        a.download = '';
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => {
          btn.classList.remove('success');
          icon.innerHTML = arrowIcon;
        }, 2000);
      }, 1500);
    });
  </script>

</body>
</html>
